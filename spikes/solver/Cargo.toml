[package]
name = "spike-solver"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509f", features = ["zstd"] }
# Upstream depends on bincode "2.0.0-rc.3", which semver resolves to 2.0.x (breaking). Pin it.
bincode = "=2.0.0-rc.3"
bincode_derive = "=2.0.0-rc.3"

[profile.release]
debug = false
