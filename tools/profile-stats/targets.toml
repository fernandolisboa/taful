# Target HUD stats per bot profile (#31), as [target, tolerance] in percent
# (af: bets and raises per call, flop). Taken from the usual HUD reads for
# each player type in 6-max cash at 100bb, not tuned by feel.
# `profile-stats tune` moves content/bots/<id>.toml until every value is
# inside its band:
#   vpip          voluntarily puts money in preflop, share of hands
#   pfr           raises preflop, share of hands (no limps in the tree, so a
#                 calling station's way in is calling raises)
#   threebet      re-raises when facing one raise, share of chances
#   fold_to_cbet  folds to the preflop raiser's first flop bet
#   af            flop aggression factor: (bets + raises) / calls

[nit]
vpip = [13.0, 2.0]
