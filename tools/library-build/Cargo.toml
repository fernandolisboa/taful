[package]
name = "taful-library-build"
description = "Offline library build: preflop solve, postflop batch solves, export to the Taful format. Never shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The workspace lints, with `unsafe_code` lowered from forbid to deny: one
# call into postflop-solver's evaluator needs it (postflop/profiles.rs,
# `evaluate`). This tool is never shipped.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# postflop-solver (AGPL, D11): only this crate may depend on it, and
# tools/arch-check enforces that. Pinned to the last upstream commit;
# `default-features = false` drops its bincode serialization (which broke on
# bincode 2.0, spike §9.2): we export to Taful's own format instead.
[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509f", default-features = false, features = ["rayon"] }
serde_json.workspace = true
taful-core.workspace = true
taful-solver = { workspace = true, features = ["parallel"] }
serde.workspace = true
toml.workspace = true
blake3.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon.workspace = true
