# Preflop charts for the first slice: cash 6-max, 100bb, rake 0 (spec §6, D2, D12).
# Run: cargo run --release -p taful-library-build -- preflop manifests/preflop-6max-100bb.toml <out-dir>

[game]
table_size = 6
stack_bb = 100

[sizing]
open_bb = 2.5
sb_open_bb = 3.0
threebet_ip_mult = 3.0
threebet_oop_mult = 3.75
squeeze_per_caller_mult = 1.0
fourbet_mult = 2.2
max_raises = 4                 # open, 3-bet, 4-bet, 5-bet all-in
round_bb = 0.5
allin_above_stack_pct = 40.0

[tree]
max_players_postflop = 3
cold_call_max_level = 1

# Charts v0 (spec §6): published-style defaults. v1 recalibrates them from
# the postflop library (root EV ÷ pot × raw equity per configuration, M4).
[realization]
srp = [1.0, 0.80]              # [in position, out of position]
threebet = [1.0, 0.85]
fourbet = [1.0, 0.95]
equity_exponent = 1.3
low_spr = 2.0

[solve]
iterations = 2000
equity_samples = 3000
seed = 20261105
prune_reach_pct = 0.1

# Best responses against each bot profile (spec §9, D8, D12): one extra chart
# per profile, `preflop-<id>.tafl`, next to the reference chart. Not part of
# the reference chart's hash.
[profiles]
dir = "../../../content/bots"
ids = ["nit", "calling-station", "maniac", "tag"]
