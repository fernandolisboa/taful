[package]
name = "taful-app"
description = "Taful application services; the only crate the UI talks to. UI-free."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# `parallel` (default): on-demand preflop best responses for mixed tables
# walk the tree on rayon's pool. Off for a single-threaded target (WASM).
[features]
default = ["parallel"]
parallel = ["taful-solver/parallel"]

[dependencies]
taful-core.workspace = true
taful-solver.workspace = true
taful-content.workspace = true
taful-store.workspace = true
fluent-bundle.workspace = true
serde.workspace = true
serde_json.workspace = true
unic-langid.workspace = true
fluent-syntax.workspace = true
rand.workspace = true
rand_chacha.workspace = true
fsrs.workspace = true
jiff.workspace = true
blake3.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
