[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop", "tools/*"]
exclude = ["spikes/solver", "spikes/evaluator"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Workspace crates. The allowed edges between them are enforced by
# tools/arch-check (spec §4): core ← solver ← app ← desktop, core ← content ← app,
# store ← app.
taful-core = { path = "crates/taful-core" }
taful-solver = { path = "crates/taful-solver" }
taful-content = { path = "crates/taful-content" }
taful-store = { path = "crates/taful-store" }
taful-app = { path = "crates/taful-app" }

# Third party (spec §4.1).
fluent-bundle = "0.16"
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
fluent-syntax = "0.12"
serde_json = "1"
unic-langid = "0.9"
rs_poker = { version = "5", default-features = false }
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.10", default-features = false }
blake3 = { version = "1", default-features = false }
toml = "0.9"
proptest = "1"
# Pure-Rust zstd (MIT): builds for wasm32 without a C toolchain (spec §7.5).
ruzstd = "0.9"
# Offline tools only (tools/library-build).
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
fsrs = "6"
pulldown-cmark = { version = "0.13", default-features = false }
ulid = "3"
jiff = "0.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
