name: CI

# Docs-only changes skip CI: the Windows release build takes ~10 min.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  # A manual run on main can also publish a beta or stable release (D18).
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release from this run (main only)"
        type: choice
        options: [none, beta, stable]
        default: none

# PR runs cancel older runs of the same PR. Runs on main queue instead, so a
# push never cancels a release run (D18) or the other way round.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # UI-free crates and tools. gpui 0.2.2 does not build on Linux (xattr vs
  # libc >= 0.2.182, see docs/spikes/9.1-gpui-table.md), so the desktop app
  # is excluded here and covered by the Windows job.
  linux:
    name: Linux (core crates, tools, checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Architecture checks (dependency direction, no AGPL in shipped crates)
        run: cargo run --locked -q -p taful-arch-check

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude taful-desktop --all-targets

      - name: Tests
        run: cargo test --locked --workspace --exclude taful-desktop

      # Exhaustive 7-card counts, pinned preflop equities and the full
      # property-test budget only run in release (spec §17).
      - name: Tests (taful-core, release, exhaustive)
        run: cargo test --locked --release -p taful-core -- --include-ignored

      - name: WASM-safe crates build for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown -p taful-core -p taful-solver

      - name: Content check
        run: cargo run --locked -q -p taful-content-check -- content

  windows:
    name: Windows (desktop app)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The build's version (D18), compiled into the app as TAFUL_VERSION and
      # used for the installer: main pushes are alphas, a manual run may be a
      # beta or the stable workspace version. The run number leads the
      # pre-release so builds sort by run whatever their kind (an alpha after
      # a beta is newer), and PR builds (`0.pr…`) sort below all of them.
      - name: Version
        id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          $ws = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'taful-desktop' | Select-Object -ExpandProperty version
          $version = switch ($env:EVENT) {
            'push' { "$ws-$env:RUN.alpha" }
            'pull_request' { "$ws-0.pr$env:PR.$env:RUN" }
            default {
              switch ($env:RELEASE) {
                'stable' { $ws }
                'beta' { "$ws-$env:RUN.beta" }
                default { "$ws-0.dev.$env:RUN" }
              }
            }
          }
          Write-Host "Version $version"
          "TAFUL_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Clippy
        run: cargo clippy --locked --release -p taful-desktop --all-targets

      - name: Tests (color-literal lint, Fluent ids)
        run: cargo test --locked --release -p taful-desktop

      - name: Build
        run: cargo build --locked --release -p taful-desktop

      # Launch the app on the runner's desktop and capture the screen, so the
      # render can be checked without a local Windows machine. The runner has
      # no GPU, so this also exercises GPUI's software (WARP) fallback.
      - name: Smoke run + screenshot
        shell: pwsh
        run: |
          # Open the table screen (M3) so the screenshot shows the preflop trainer.
          $env:TAFUL_SCREEN = "table"
          # No guided tour over the screenshot (#58).
          $env:TAFUL_TOUR = "0"
          # No update check against the real releases (D18).
          $env:TAFUL_UPDATE_URL = "http://127.0.0.1:9/none"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # Once per visual style (D19): each embeds its own fonts and art.
          foreach ($style in "classic", "salao", "baralho") {
            $env:TAFUL_STYLE = $style
            $shot = if ($style -eq "classic") { "screenshot.png" } else { "screenshot-$style.png" }
            $app = Start-Process -FilePath target\release\taful.exe -PassThru `
              -RedirectStandardOutput "stdout-$style.log" -RedirectStandardError "stderr-$style.log"
            Start-Sleep -Seconds 15
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(400, 300)
            Start-Sleep -Seconds 2
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            $alive = -not $app.HasExited
            if ($alive) { Stop-Process -Id $app.Id -Force; $app.WaitForExit() }
            Get-Content "stdout-$style.log", "stderr-$style.log" -ErrorAction SilentlyContinue
            if (-not $alive) { throw "taful.exe ($style) exited early (code $($app.ExitCode))" }
          }

      # Unsigned per-user installer (D14, issue #20), versioned like the app.
      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:TAFUL_VERSION
          function Find-Iscc {
            $c = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($c) { return $c.Source }
            Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          # taful.iss needs Inno Setup >= 6.3 (x64compatible).
          Write-Host "ISCC $((Get-Item $iscc).VersionInfo.ProductVersion) at $iscc"
          # VersionInfoVersion takes numbers only: drop any SemVer suffix.
          $numeric = ($version -split '[-+]')[0]
          & $iscc "/DAppVersion=$version" "/DNumericVersion=$numeric" installer\taful.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          "INSTALLER=target\installer\taful-setup-$version.exe" >> $env:GITHUB_ENV
          "INSTALLER_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install, upgrade, uninstall (data folder must survive)
        shell: pwsh
        run: ./installer/check.ps1 -Setup $env:INSTALLER

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: taful-setup-${{ env.INSTALLER_VERSION }}
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: taful-windows-x64
          path: target/release/taful.exe
          if-no-files-found: error

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: |
            screenshot*.png
            stdout-*.log
            stderr-*.log
            install.log
            upgrade.log
            update.log
          if-no-files-found: ignore

  # GitHub Release the app's auto-update reads (D18): every push to main
  # publishes an alpha; a manual run on main with `release` publishes a beta
  # or the stable workspace version. Only after both jobs passed.
  release:
    name: Publish release
    needs: [linux, windows]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release != 'none'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taful-setup-${{ needs.windows.outputs.version }}
          path: dist

      - name: Publish
        working-directory: dist
        run: |
          set -euo pipefail
          exe="taful-setup-$VERSION.exe"
          sha256sum "$exe" > "$exe.sha256"
          cat "$exe.sha256"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists; bump the workspace version"
            exit 1
          fi
          stable="${VERSION%%-*}"
          if [[ "$VERSION" == *-* ]] && gh release view "v$stable" >/dev/null 2>&1; then
            echo "::warning::v$stable is already released, so $VERSION sorts below it and no installed app will update to it. Bump the workspace version."
          fi
          flags=(--prerelease --latest=false)
          [[ "$VERSION" == *-* ]] || flags=(--latest)
          gh release create "v$VERSION" "$exe" "$exe.sha256" \
            --target "$GITHUB_SHA" --title "Taful $VERSION" --generate-notes "${flags[@]}"

      # Old alphas only fill the list: keep the newest 10.
      - name: Prune old alphas
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("\\.alpha$"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
