name: CI

# Docs-only changes skip CI: the Windows release build takes ~10 min.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # UI-free crates and tools. gpui 0.2.2 does not build on Linux (xattr vs
  # libc >= 0.2.182, see docs/spikes/9.1-gpui-table.md), so the desktop app
  # is excluded here and covered by the Windows job.
  linux:
    name: Linux (core crates, tools, checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Architecture checks (dependency direction, no AGPL in shipped crates)
        run: cargo run --locked -q -p taful-arch-check

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude taful-desktop --all-targets

      - name: Tests
        run: cargo test --locked --workspace --exclude taful-desktop

      # Exhaustive 7-card counts, pinned preflop equities and the full
      # property-test budget only run in release (spec §17).
      - name: Tests (taful-core, release, exhaustive)
        run: cargo test --locked --release -p taful-core -- --include-ignored

      - name: WASM-safe crates build for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown -p taful-core -p taful-solver

      - name: Content check
        run: cargo run --locked -q -p taful-content-check -- content

  windows:
    name: Windows (desktop app)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --release -p taful-desktop --all-targets

      - name: Tests (color-literal lint, Fluent ids)
        run: cargo test --locked --release -p taful-desktop

      - name: Build
        run: cargo build --locked --release -p taful-desktop

      # Launch the app on the runner's desktop and capture the screen, so the
      # render can be checked without a local Windows machine. The runner has
      # no GPU, so this also exercises GPUI's software (WARP) fallback.
      - name: Smoke run + screenshot
        shell: pwsh
        run: |
          # Open the table screen (M3) so the screenshot shows the preflop trainer.
          $env:TAFUL_SCREEN = "table"
          $app = Start-Process -FilePath target\release\taful.exe -PassThru `
            -RedirectStandardOutput stdout.log -RedirectStandardError stderr.log
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(400, 300)
          Start-Sleep -Seconds 2
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $alive = -not $app.HasExited
          if ($alive) { Stop-Process -Id $app.Id -Force }
          Get-Content stdout.log, stderr.log -ErrorAction SilentlyContinue
          if (-not $alive) { throw "taful.exe exited early (code $($app.ExitCode))" }

      # Unsigned per-user installer (D14, issue #20). Version = workspace version.
      - name: Build installer
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'taful-desktop' | Select-Object -ExpandProperty version
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $iscc = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          & $iscc "/DAppVersion=$version" installer\taful.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          "INSTALLER=target\installer\taful-setup-$version.exe" >> $env:GITHUB_ENV
          "INSTALLER_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install, upgrade, uninstall (data folder must survive)
        shell: pwsh
        run: ./installer/check.ps1 -Setup $env:INSTALLER

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: taful-setup-${{ env.INSTALLER_VERSION }}
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: taful-windows-x64
          path: target/release/taful.exe
          if-no-files-found: error

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: |
            screenshot.png
            stdout.log
            stderr.log
            install.log
            upgrade.log
          if-no-files-found: ignore
