# Level test of Primeiros passos (D24): optional in every study mode.
# Passing it opens Fundamentos in the Prova mode; it never marks lessons done
# (D25). Each attempt draws `draw` questions spread over the level's lessons
# (one per lesson, in a random order, before a second from any). Format:
# crates/taful-content/src/level_test.rs.

