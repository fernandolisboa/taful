# Calls too much and rarely raises (spec §9). Multipliers scale the share of
# the range that takes an action group; 1 = the reference strategy. The tree
# has no limps, so a station gets into pots by calling raises: it opens
# tight (pfr_mult < 1), continues very wide facing a raise (vpip_mult) and
# almost never re-raises (threebet_mult). Tuned in #31 to VPIP 45, PFR 10,
# 3-bet 2 (tools/profile-stats/targets.toml).
id = "calling-station"

[preflop]
vpip_mult = 7.506
pfr_mult = 0.586
threebet_mult = 0.087

# Postflop shifts, each in -1..=1 (0 = reference): fold_to_cbet and
# fold_to_raise > 0 fold more to a bet / a raise; aggression > 0 bets and
# raises more; bluff_value_shift > 0 makes bets value-heavier, < 0 bluffier.
# Calibrated in #31 with tools/profile-stats against
# tools/profile-stats/targets.toml (fold_to_cbet and aggression; the
# others are set by hand).
[postflop]
fold_to_cbet = -0.853
fold_to_raise = -0.20
bluff_value_shift = -0.3
aggression = -0.108

# Moves half of the other bet sizes to the preferred one (small, large or
# reference = no preference).
[sizing]
prefer = "small"
