# Plays few hands, folds too much to aggression (spec §9). Multipliers scale
# the share of the range that takes an action group; 1 = the reference.
id = "nit"

[preflop]
vpip_mult = 0.454
pfr_mult = 0.615
threebet_mult = 0.439

# Postflop shifts, each in -1..=1 (0 = reference): fold_to_cbet and
# fold_to_raise > 0 fold more to a bet / a raise; aggression > 0 bets and
# raises more; bluff_value_shift > 0 makes bets value-heavier, < 0 bluffier.
# Calibrated in #31 with tools/profile-stats against
# tools/profile-stats/targets.toml (fold_to_cbet and aggression; the
# others are set by hand).
[postflop]
fold_to_cbet = 0.65
fold_to_raise = 0.3
bluff_value_shift = 0.4
aggression = -0.468

# Moves half of the other bet sizes to the preferred one (small, large or
# reference = no preference).
[sizing]
prefer = "reference"
