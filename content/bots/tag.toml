# Tight-aggressive regular: close to the reference, a bit tighter and a bit
# more aggressive (spec §9). Multipliers scale the share of the range that
# takes an action group; 1 = the reference.
id = "tag"

[preflop]
vpip_mult = 0.85
pfr_mult = 0.95
threebet_mult = 1.2

# Postflop shifts, each in -1..=1 (0 = reference): fold_to_cbet and
# fold_to_raise > 0 fold more to a bet / a raise; aggression > 0 bets and
# raises more; bluff_value_shift > 0 makes bets value-heavier, < 0 bluffier.
# Calibrated on the first-slice library in #31.
[postflop]
fold_to_cbet = 0.05
fold_to_raise = 0.1
bluff_value_shift = 0.1
aggression = 0.15

# Moves half of the other bet sizes to the preferred one (small, large or
# reference = no preference).
[sizing]
prefer = "reference"
