# The lesson catalog (D23): every lesson has a level and a theme, and the
# lessons screen regroups the same lessons by either ("Ver por").
#
# `levels` and `themes` are in display order. A level's title is the Fluent
# message `level-<id>` with a one-line description `level-<id>-about`; a
# theme's title is `theme-<id>` (i18n/*/lessons.ftl, checked by
# content-check). A level with no lessons yet shows as "em breve".
#
# `lessons` is the Jornada: level by level, in reading order within a level.
# The Temas view keeps the same order inside each theme. A lesson's
# prerequisites must come earlier in this list, never in a higher level.

