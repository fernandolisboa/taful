    { en-US = "Your hand is strong in absolute terms", pt-BR = "Sua mão é forte em termos absolutos" },
    { en-US = "The opponent folds", pt-BR = "O adversário folda" },
    { en-US = "You are ahead of the calling range more than half the time", pt-BR = "Você está à frente do range que paga mais da metade das vezes" },
]
