    { en-US = "A bet with a hand only slightly ahead of the calls", pt-BR = "Uma aposta com uma mão só um pouco à frente dos calls" },
    { en-US = "A bet with the nuts", pt-BR = "Uma aposta com o nuts" },
]
answer = 1

[[questions]]
