[[questions]]
id = "hole-cards"
kind = "choice"
prompt = { en-US = "How many cards does each player get face down?", pt-BR = "Quantas cartas fechadas cada jogador recebe?" }
choices = [
    { en-US = "Two", pt-BR = "Duas" },
    { en-US = "Five", pt-BR = "Cinco" },
    { en-US = "Seven", pt-BR = "Sete" },
]
answer = 0
explanation = { en-US = "Two hole cards each; the five on the board are shared.", pt-BR = "Duas cartas da mão para cada um; as cinco da mesa são de todos." }

