id = "alpha-101-quiz"
version = 1
lesson = "alpha-101"
pass = 0.75

[[questions]]
id = "pot-bluff"
kind = "numeric"
prompt = { en-US = "A pot-size bluff needs how many folds to break even, in %?", pt-BR = "Um blefe do tamanho do pote precisa de quantos folds para empatar, em %?" }
answer = "{{ calc: alpha(pot=1, bet=1) | pct(0) }}"
tolerance = 1.0

[[questions]]
id = "third"
kind = "numeric"
prompt = { en-US = "Pot 9 bb, you bluff 3 bb. Folds needed, in %?", pt-BR = "Pote 9 bb, você blefa 3 bb. Folds necessários, em %?" }
answer = "{{ calc: alpha(pot=9, bet=3) | pct(0) }}"
tolerance = 1.0

[[questions]]
id = "sum"
kind = "choice"
prompt = { en-US = "Alpha + MDF for the same bet size equals…", pt-BR = "Alpha + MDF para o mesmo tamanho de aposta dá…" }
choices = [
    { en-US = "100%", pt-BR = "100%" },
    { en-US = "50%", pt-BR = "50%" },
    { en-US = "It depends on the hand", pt-BR = "Depende da mão" },
]
answer = 0

[[questions]]
id = "semi-bluff"
kind = "choice"
prompt = { en-US = "Why does a semi-bluff need fewer folds than alpha?", pt-BR = "Por que um semiblefe precisa de menos folds que o alpha?" }
choices = [
    { en-US = "It can still win when called", pt-BR = "Ele ainda pode ganhar quando é pago" },
    { en-US = "It is a smaller bet", pt-BR = "É uma aposta menor" },
    { en-US = "It does not; it needs more", pt-BR = "Não precisa; precisa de mais" },
]
answer = 0
