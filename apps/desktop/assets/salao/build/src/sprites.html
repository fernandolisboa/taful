<!doctype html>
<html><head><meta charset="utf-8"><title>Salão sprites</title>
<link rel="stylesheet" href="sprites.css">
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="s" viewBox="0 0 24 24"><path d="M12 2.2S3.6 8.6 3.6 14c0 2.7 2 4.5 4.3 4.5 1.3 0 2.5-.6 3.2-1.6-.1 2-.8 3.6-2.1 4.9h6c-1.3-1.3-2-2.9-2.1-4.9.7 1 1.900 1.600 3.200 1.600 2.300 0 4.300-1.800 4.300-4.500C20.400 8.600 12 2.200 12 2.200z"/></symbol>
<symbol id="h" viewBox="0 0 24 24"><path d="M12 21.300S3.400 15.600 3.400 9.500C3.400 6.200 5.900 4 8.600 4c1.600 0 2.800.800 3.400 1.900C12.600 4.800 13.800 4 15.400 4c2.700 0 5.200 2.200 5.200 5.500 0 6.100-8.600 11.800-8.600 11.800z"/></symbol>
<symbol id="d" viewBox="0 0 24 24"><path d="M12 2.200c1.800 3.700 4.300 7 7.400 9.800-3.100 2.800-5.600 6.100-7.400 9.800-1.800-3.700-4.300-7-7.400-9.800C7.700 9.200 10.200 5.900 12 2.200z"/></symbol>
<symbol id="c" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4.300"/><circle cx="6.900" cy="13.700" r="4.300"/><circle cx="17.100" cy="13.700" r="4.300"/><path d="M12 10.500c0 5-.800 8.300-2.500 11.300h5c-1.700-3-2.500-6.300-2.500-11.300z"/><circle cx="12" cy="12.200" r="2.200"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<!-- data-out: file name; data-scale: device pixels per CSS pixel (2 unless given);
     data-webp: store as WebP at this quality instead of PNG. -->
<div class="box" data-out="bg" data-scale="0.5" data-webp="0.95" style="width:1600px;height:900px"><div class="bg"></div></div>

<div class="box" data-out="hero" data-webp="0.95" style="width:441px;height:236px"><div class="hero-clip"><div class="hero-r">
  <div class="fan"><i class="pc xl" data-c="As"></i><i class="pc xl" data-c="Kh"></i><i class="pc xl" data-c="Qd"></i><i class="pc xl" data-c="Jc"></i></div>
  <div class="pile" style="left:296px;top:146px"><i class="chips" data-s="100,100,100,100,100"></i><i class="chips" data-s="25,25,25,25,25,25,25"></i><i class="chips" data-s="5,5,5,5"></i></div>
</div></div></div>

<div class="box" data-out="table" data-webp="0.95" style="width:780px;height:420px"><div class="rail"><div class="felt"></div></div></div>

<div class="box" data-out="card_lg" style="width:68px;height:94px"><i class="pc lg face"></i></div>
<div class="box" data-out="card_sm" style="width:38px;height:52px"><i class="pc sm face"></i></div>
<div class="box" data-out="card_xs" style="width:22px;height:30px"><i class="pc xs face"></i></div>
<div class="box" data-out="back_sm" style="width:38px;height:52px"><i class="pc sm back face"></i></div>
<div class="box" data-out="back_lg" style="width:68px;height:94px"><i class="pc lg back face"></i></div>

<!-- A chip with its shadows: the disc sits at (6, 3) in a 38x40 box. -->
<div class="box" data-out="chip_1" style="width:38px;height:40px"><u class="chip c1" style="left:6px;top:3px;bottom:auto"></u></div>
<div class="box" data-out="chip_5" style="width:38px;height:40px"><u class="chip c5" style="left:6px;top:3px;bottom:auto"></u></div>
<div class="box" data-out="chip_25" style="width:38px;height:40px"><u class="chip c25" style="left:6px;top:3px;bottom:auto"></u></div>
<div class="box" data-out="chip_100" style="width:38px;height:40px"><u class="chip c100" style="left:6px;top:3px;bottom:auto"></u></div>
<div class="box" data-out="chip_500" style="width:38px;height:40px"><u class="chip c500" style="left:6px;top:3px;bottom:auto"></u></div>

<!-- The dealer button with its shadows: the disc sits at (10, 5) in a 46x44 box. -->
<div class="box" data-out="dealer" style="width:46px;height:44px"><div class="dealer" style="left:10px;top:5px">D</div></div>

<div class="box" data-out="medal_done" style="width:56px;height:56px"><div class="med-done"></div></div>
<div class="box" data-out="avatar_hero" style="width:40px;height:40px"><div class="av-hero"></div></div>

<!-- Verdict seals. Best is the mockup's; the others follow it in their grade's color:
     a check for a right answer, the chess marks ?!, ? and ?? for the rest. -->
<div class="box" data-out="seal_best" style="width:60px;height:60px"><div class="seal" style="--hi:#9df0d6;--c:#46c9a6;--lo:#239a7d;--ink:#062820"><svg viewBox="0 0 24 24"><use href="#check"/></svg></div></div>
<div class="box" data-out="seal_correct" style="width:60px;height:60px"><div class="seal" style="--hi:#d3eeb0;--c:#9fcd6a;--lo:#6f9f3d;--ink:#17280a"><svg viewBox="0 0 24 24"><use href="#check"/></svg></div></div>
<div class="box" data-out="seal_inaccuracy" style="width:60px;height:60px"><div class="seal" style="--hi:#f7eaa6;--c:#e8cf5a;--lo:#b59c2c;--ink:#2a2306"><b>?!</b></div></div>
<div class="box" data-out="seal_mistake" style="width:60px;height:60px"><div class="seal" style="--hi:#f9c39a;--c:#ee8a42;--lo:#bb611f;--ink:#2e1505"><b>?</b></div></div>
<div class="box" data-out="seal_blunder" style="width:60px;height:60px"><div class="seal" style="--hi:#dfcbfb;--c:#b994f2;--lo:#8a66c4;--ink:#1f1136"><b>??</b></div></div>

<script>
const suit = (id) => `<svg class="pip" viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"/></svg>`;
document.querySelectorAll('.pc').forEach((el) => {
  const c = el.dataset.c;
  if (!c) return;
  el.classList.add('s-' + c[1]);
  el.innerHTML = `<b>${c[0]}</b>${suit(c[1])}`;
});
document.querySelectorAll('.chips').forEach((el) => {
  const list = (el.dataset.s || '').split(',');
  el.innerHTML = list.map((v, i) => `<u class="chip c${v}" style="--i:${i}"></u>`).join('');
  el.style.setProperty('--n', list.length);
});
</script>
</body></html>
