[package]
name = "taful-desktop"
description = "Taful desktop app (Windows): GPUI views, layout model, themes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "taful"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
taful-app.workspace = true
semver.workspace = true
ureq.workspace = true
futures.workspace = true
# Generated textures of the Baralho style (felt glow, card backs). The same
# version gpui already links.
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
windows-registry.workspace = true

# Any host: a Windows build needs its icon wherever it is made.
[build-dependencies]
embed-resource.workspace = true
